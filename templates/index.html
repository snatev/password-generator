<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SNATEV Password Generator - Create Strong, Random & Secure Passwords Online</title>

    <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='assets/icon32.webp') }}">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='assets/icon32.webp') }}">
    <link rel="shortcut icon" href="{{ url_for('static', filename='assets/icon32.webp') }}">

    <meta name="author" content="SNATEV">
    <meta name="robots" content="index, follow">
    <meta name="description" content="SNATEV Password Generator helps you create strong, random, and secure passwords instantly with customizable length, character types, and advanced options for better online account protection.">
    <meta name="keywords" content="SNATEV, password generator, secure password generator, random password, strong password, online password tool, password strength, create password, cybersecurity, account security">
    <link rel="canonical" href="{{ request.url }}">
    <meta property="og:site_name" content="SNATEV">
    <meta property="og:locale" content="en_US">
    <meta property="og:type" content="website">
    <meta property="og:title" content="SNATEV Password Generator - Create Strong, Random & Secure Passwords Online">
    <meta property="og:description" content="Generate secure passwords with custom length and character settings in seconds. Free, fast, and built for stronger account security.">
    <meta property="og:url" content="{{ request.url }}">
    <meta property="og:image" content="{{ url_for('static', filename='assets/icon512.webp', _external=True) }}">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="SNATEV Password Generator - Create Strong, Random & Secure Passwords Online">
    <meta name="twitter:description" content="Generate secure passwords with custom length and character settings in seconds.">
    <meta name="twitter:image" content="{{ url_for('static', filename='assets/icon512.webp', _external=True) }}">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css', v='20260228-1') }}">
</head>
<body>

    <div class="orb orb-top"></div>
    <div class="orb orb-3"></div>

    <div class="dot-grid"></div>

    <div class="scene">

        <div class="side-mockups left" aria-hidden="true">
            <div class="mockup-card m1">
                <div class="mockup-line"></div>
                <div class="mockup-line short"></div>
            </div>
            <div class="mockup-card m2">
                <div class="mockup-line"></div>
                <div class="mockup-line short"></div>
            </div>
            <div class="mockup-card m5">
                <div class="mockup-line"></div>
                <div class="mockup-line short"></div>
            </div>
        </div>

        <div class="side-mockups right" aria-hidden="true">
            <div class="mockup-card m3">
                <div class="mockup-line"></div>
                <div class="mockup-line short"></div>
            </div>
            <div class="mockup-card m4">
                <div class="mockup-line"></div>
                <div class="mockup-line short"></div>
            </div>
            <div class="mockup-card m6">
                <div class="mockup-line"></div>
                <div class="mockup-line short"></div>
            </div>
        </div>

        <div class="app-wrapper">
            <div class="app-card">

                <div class="card-header">
                    <div class="brand">
                        <div class="brand-icon">
                            <i class="fas fa-shield-halved"></i>
                        </div>
                        <div class="brand-text">
                            <span class="brand-name">SNATEV</span>
                            <span class="brand-sub">Password Generator</span>
                        </div>
                    </div>
                    <a class="header-web" href="https://snatev.com" target="_blank" rel="noopener noreferrer" aria-label="Visit snatev.com" title="snatev.com">
                        <i class="fas fa-globe"></i>
                    </a>
                </div>

                <div class="card-body">

                    <div class="col col-left">

                        <div class="panel pwd-panel">
                            <div class="panel-label">
                                <i class="fas fa-key"></i>
                                Generated Password
                            </div>
                            <div class="pwd-display">
                                <span class="pwd-text" id="passwordDisplay">Click Generate</span>
                                <div class="pwd-copy-toast" id="copyNotification">Copied!</div>
                                <div class="pwd-actions">
                                    <button class="icon-btn" id="copyBtn" title="Copy">
                                        <i class="fas fa-copy"></i>
                                    </button>
                                    <button class="icon-btn" id="refreshBtn" title="New password">
                                        <i class="fas fa-arrows-rotate"></i>
                                    </button>
                                </div>
                            </div>
                        </div>

                        <div class="panel strength-panel">
                            <div class="strength-top">
                                <div class="panel-label">
                                    <i class="fas fa-chart-simple"></i>
                                    Strength
                                </div>
                                <span class="strength-badge" id="strengthBadge">&mdash;</span>
                            </div>
                            <div class="strength-segs" id="strengthSegs">
                                <div class="seg"></div>
                                <div class="seg"></div>
                                <div class="seg"></div>
                                <div class="seg"></div>
                                <div class="seg"></div>
                            </div>
                            <p class="strength-detail" id="strengthDetail">Generate a password to see its strength</p>
                        </div>

                        <button class="generate-btn" id="generateBtn">
                            <i class="fas fa-bolt"></i>
                            Generate Password
                        </button>

                    </div>

                    <div class="col col-right">

                        <div class="panel length-panel">
                            <div class="length-header">
                                <div class="panel-label">
                                    <i class="fas fa-ruler-horizontal"></i>
                                    Length
                                </div>
                                <span class="length-badge" id="lengthValue">12</span>
                            </div>
                            <input type="range" class="slider" id="lengthSlider" min="4" max="64" value="12">
                            <div class="slider-limits">
                                <span>4</span>
                                <span>64</span>
                            </div>
                        </div>

                        <div class="panel chars-panel">
                            <div class="panel-label">
                                <i class="fas fa-shapes"></i>
                                Character Types
                            </div>
                            <div class="char-pills">
                                <label class="pill">
                                    <input type="checkbox" id="uppercaseOption" checked>
                                    <span class="pill-inner">A&ndash;Z</span>
                                </label>
                                <label class="pill">
                                    <input type="checkbox" id="lowercaseOption" checked>
                                    <span class="pill-inner">a&ndash;z</span>
                                </label>
                                <label class="pill">
                                    <input type="checkbox" id="numbersOption" checked>
                                    <span class="pill-inner">0&ndash;9</span>
                                </label>
                                <label class="pill">
                                    <input type="checkbox" id="symbolsOption">
                                    <span class="pill-inner">@#$!</span>
                                </label>
                            </div>
                        </div>

                        <div class="panel advanced-panel">
                            <div class="panel-label">
                                <i class="fas fa-sliders"></i>
                                Options
                            </div>
                            <div class="adv-options">
                                <label class="adv-option">
                                    <input type="checkbox" id="similarOption">
                                    <span class="adv-check"><i class="fas fa-check"></i></span>
                                    <span class="adv-text">Exclude similar</span>
                                </label>
                                <label class="adv-option">
                                    <input type="checkbox" id="ambiguousOption">
                                    <span class="adv-check"><i class="fas fa-check"></i></span>
                                    <span class="adv-text">Exclude ambiguous</span>
                                </label>
                                <label class="adv-option">
                                    <input type="checkbox" id="easyToSayOption">
                                    <span class="adv-check"><i class="fas fa-check"></i></span>
                                    <span class="adv-text">Easy to pronounce</span>
                                </label>
                                <label class="adv-option">
                                    <input type="checkbox" id="autoGenOption" checked>
                                    <span class="adv-check"><i class="fas fa-check"></i></span>
                                    <span class="adv-text">Auto-generate</span>
                                </label>
                            </div>
                        </div>

                    </div>

                </div>
            </div>

        </div>

    </div>

    <script src="{{ url_for('static', filename='script.js', v='20260228-2') }}"></script>
</body>
</html>
